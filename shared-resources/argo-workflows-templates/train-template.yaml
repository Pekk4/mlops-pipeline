apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: train-template
  namespace: ml-workflows
spec:
  entrypoint: pipeline
  serviceAccountName: argo-workflow

  arguments:
    parameters:
      - name: training_image
      - name: update_manifests_image
      - name: repo_url
      - name: tracking_uri
      - name: s3_endpoint

  templates:
    - name: pipeline
      dag:
        tasks:
          - name: train
            template: train

          - name: update-manifests
            dependencies: [train]
            template: update-manifests
            arguments:
              parameters:
                - name: model_uri
                  value: "{{tasks.train.outputs.parameters.model_uri}}"

    - name: train
      outputs:
        parameters:
          - name: model_uri
            valueFrom:
              path: /tmp/model-uri.txt

      container:
        image: "{{workflow.parameters.training_image}}"
        command: ["python"]
        args: ["train.py"]
        env:
          - name: MLFLOW_TRACKING_URI
            value: "{{workflow.parameters.tracking_uri}}"

          - name: MLFLOW_S3_ENDPOINT_URL
            value: "{{workflow.parameters.s3_endpoint}}"

          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: minio-creds
                key: accesskey

          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: minio-creds
                key: secretkey

    - name: update-manifests
      inputs:
        parameters:
          - name: model_uri

      container:
        image: "{{workflow.parameters.update_manifests_image}}"
        command: ["sh", "-c"]
        env:
          - name: GH_TOKEN
            valueFrom:
              secretKeyRef:
                name: github-token
                key: token
        args:
          - |
            set -e

            echo "Using model: {{inputs.parameters.model_uri}}"

            AUTH_REPO_URL="$(echo "{{workflow.parameters.repo_url}}" | sed 's#https://#https://x-access-token:'"${GH_TOKEN}"'@#')"

            git clone "${AUTH_REPO_URL}" repo
            cd repo

            yq -i '.spec.predictor.model.storageUri = "{{inputs.parameters.model_uri}}"' manifests/serving/inference-service.yaml

            git config user.name "argo-bot"
            git config user.email "argo@example.com"
            git commit -am "Update model to {{inputs.parameters.model_uri}}"
            git push origin master
