apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/pekk4/mlops-pipeline.git
    #targetRevision: c8720dd8c060d954b5d7093c3d30b87ea4932e7f
    targetRevision: istiotest
    path: platform
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true