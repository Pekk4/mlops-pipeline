apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-ingressclass
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/pekk4/mlops-pipeline.git
    targetRevision: master
    path: components/istio
  destination:
    server: https://kubernetes.default.svc
    #namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
