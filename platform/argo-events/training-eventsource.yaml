apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: training-webhook
  namespace: argo-events
  annotations:
    argocd.argoproj.io/sync-wave: "5000"
spec:
  eventBusName: default

  service:
    ports:
      - port: 12000
        targetPort: 12000

  webhook:
    training:
      port: "12000"
      endpoint: /train
      method: POST
