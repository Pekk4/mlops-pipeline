apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1900"
spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 89.2.0
    helm:
      releaseName: prometheus
      valuesObject:
        prometheus:
          ingress:
            enabled: true
            ingressClassName: istio
            hosts:
              - prometheus.local
            paths:
              - /
            pathType: Prefix

          prometheusSpec:
            ruleSelector:
              matchLabels:
                monitoring: model-rules
            ruleNamespaceSelector: {}

        alertmanager:
          enabled: true
          alertmanagerSpec:
            useExistingSecret: false
          config:
            global:
              resolve_timeout: 5m

            route:
              receiver: argo-events-training
              group_by:
                - alertname
              group_wait: 5s
              group_interval: 30s
              repeat_interval: 1h

            receivers:
              - name: argo-events-training
                webhook_configs:
                  - url: http://training-webhook-eventsource-svc.argo-events.svc.cluster.local:12000/train
                    send_resolved: false

  destination:
    server: https://kubernetes.default.svc
    namespace: prometheus

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true